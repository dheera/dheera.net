# Install as /etc/nginx/conf.d/dheera-geoip.conf (inside Nginx's http context).
# The database must exist before this configuration is enabled.
geoip2 /var/lib/GeoIP/GeoLite2-City.mmdb {
    auto_reload 5m;
    $dheera_geo_country source=$remote_addr country iso_code;
    $dheera_geo_region source=$remote_addr subdivisions 0 iso_code;
}

# Missing country/subdivision records and all unlisted regions get the normal
# view. Use the socket's client address, never a request header or cookie.
map "$dheera_geo_country:$dheera_geo_region" $dheera_visibility {
    default normal;
    include /etc/nginx/dheera-visibility-regions.map;
}
