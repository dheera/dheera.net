# Static production site. Deploy complete releases, then atomically update
# /var/www/dheera.net/current. No Node.js process is required on the server.
server {
    listen 80;
    listen [::]:80;
    server_name dheera.net www.dheera.net;

    server_tokens off;
    return 301 https://dheera.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dheera.net www.dheera.net;

    ssl_certificate /etc/ssl/certs/STAR_dheera_net.pem;
    ssl_certificate_key /etc/ssl/certs/STAR_dheera_net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DheeraTLS:10m;

    # A return-only host canonicalization is safe inside an Nginx if block.
    if ($host = www.dheera.net) {
        return 301 https://dheera.net$request_uri;
    }

    root /var/www/dheera.net/current;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    add_header Cache-Control "public, max-age=60, s-maxage=60, must-revalidate, stale-if-error=0" always;
    add_header X-Content-Type-Options nosniff always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # nginx-geoip.conf chooses a theme asset using the client's country/subdivision.
    # Only this stylesheet varies; HTML remains the same for every visitor.
    location = /visibility.css {
        default_type text/css;
        etag off;
        if_modified_since off;
        # A local add_header replaces inherited headers on Nginx 1.18, so
        # preserve nosniff while replacing the site's public cache policy.
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /assets/visibility-$dheera_visibility.css =404;
    }

    # Preserve public links served by the previous application.
    location = /resume {
        return 302 /files/dheera-venkatraman-resume.pdf;
    }
    location = /resume.pdf {
        return 302 /files/dheera-venkatraman-resume.pdf;
    }
    location = /profile_code {
        return 302 /files/profile_code.txt;
    }
    location = /profile_code.txt {
        return 302 /files/profile_code.txt;
    }

    location ~ ^/photos/places/icelandthermal/?$ {
        return 301 /photos/icelandthermal/$is_args$args;
    }
    location ~ ^/photos/abstract/dancelight/?$ {
        return 301 /photos/dancelight/$is_args$args;
    }
    location ~ ^/photos/journeys/jinghangyunhe/?$ {
        return 301 /photos/jinghangyunhe/$is_args$args;
    }
    location ~ ^/photos/journeys/timetravelchina/?$ {
        return 301 /photos/timetravelchina/$is_args$args;
    }
    location ~ ^/projects/rosshow/?$ {
        return 301 https://github.com/dheera/rosshow;
    }
    location ~ ^/projects/rosboard/?$ {
        return 301 https://github.com/dheera/rosboard;
    }

    # Hidden source/configuration files must never be served.
    location ~ (^|/)\. {
        return 404;
    }

    # Nginx supplies directory slash redirects and index.html resolution.
    # Missing routes remain real 404 responses rather than a homepage fallback.
    location / {
        try_files $uri $uri/ =404;
    }
}
